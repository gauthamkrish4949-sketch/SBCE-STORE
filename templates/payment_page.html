<!DOCTYPE html>
<html>
<head>
    <title>Payment | SBCE Store</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .pay-box { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 10px; }
        img { width: 200px; margin: 20px 0; }
        input { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="pay-box">
        <h2>Scan & Pay</h2>
        <img src="{{ url_for('static', filename='qr_code.jpg') }}" alt="QR Code">
        
        <form action="{{ url_for('checkout') }}" method="POST" enctype="multipart/form-data">
            <p>Upload your payment screenshot:</p>
            <input type="file" name="screenshot" accept="image/*" required>
            <br>
            <button type="submit" style="padding: 10px 20px; background: #27ae60; color: white; border: none; border-radius: 5px;">Confirm Order</button>
        </form>
    </div>
</body>
</html>
