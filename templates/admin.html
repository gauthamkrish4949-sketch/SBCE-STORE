<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard | SBCE Store</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .admin-container { max-width: 1250px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #2c3e50; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #ddd; }
        .status-badge { padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .btn { border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; color: white; text-decoration: none; display: inline-block; }
        .btn-verify { background-color: #27ae60; }
    </style>
</head>
<body>
<div class="admin-container">
    <header>
        <h1>Admin Order Management</h1>
        <a href="{{ url_for('logout') }}" style="color: #e74c3c;">Logout</a>
    </header>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for order in orders %}
            <tr>
                <td>#{{ order.id }}</td>
                <td>{{ order.name }}</td>
                <td>{{ order.purchased_items }}</td>
                <td>₹{{ order.total }}</td>
                <td>{{ order.status }}</td>
                <td>
                    <form action="{{ url_for('deliver_order', order_id=order.id) }}" method="POST">
                        <button type="submit" class="btn btn-verify">🏁 Deliver</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="6" style="text-align:center;">No orders yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
